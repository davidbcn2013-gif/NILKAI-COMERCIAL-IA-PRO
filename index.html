<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>NIL&KAI · Comercial</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
background:#f7f9fc;
color:#102b4e
}
button,input{font:inherit}
button{cursor:pointer}
button{cursor:pointer}

.panel label{
display:block;
margin:12px 0 6px;
}

.panel input,
.panel textarea,
.panel select{
display:block;
width:100%;
padding:12px;
border:1px solid #d8dde3;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}



.app{
max-width:760px;
margin:auto;
min-height:100vh;
padding-bottom:88px;
background:#fff
}
.header{
height:72px;
padding:12px 16px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #e2e8ee;
position:sticky;
top:0;
background:#fff;
z-index:10
}
.brands{
display:flex;
align-items:center;
gap:10px
}
.brand{
font-family:Georgia,serif;
font-weight:700;
font-size:20px
}
.divider{
height:28px;
width:1px;
background:#cbd4dd
}
.nil{
font-size:12px;
letter-spacing:1px;
color:#68798b
}
.topMenu{
border:0;
background:none;
font-size:25px;
color:#1474c4
}
.banner{
height:205px;
background:
linear-gradient(135deg,#07385a,#176c8b 50%,#9fb4bc);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#fff;
position:relative;
overflow:hidden
}
.banner:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(90deg,rgba(0,0,0,.28),transparent,rgba(0,0,0,.2))
}
.bannerText{
position:relative;
z-index:1
}
.bannerText strong{
display:block;
font-family:Georgia,serif;
font-size:31px;
letter-spacing:1px
}
.bannerText span{
display:block;
margin-top:12px;
font-size:13px;
letter-spacing:3px
}
.content,.panel{padding:16px}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
.card{
min-height:112px;
border:1px solid #dce4ec;
border-radius:18px;
background:#fff;
box-shadow:0 3px 12px rgba(16,43,78,.07);
padding:16px;
text-align:left;
color:#102b4e
}
.card.primary{
background:#115889;
color:#fff;
border-color:#115889
}
.icon{
font-size:24px;
margin-bottom:10px
}
.card strong{
display:block;
font-size:17px
}
.card small{
display:block;
margin-top:6px;
opacity:.75;
line-height:1.3
}
.search{
width:100%;
min-height:58px;
margin-top:14px;
padding:0 16px;
display:flex;
align-items:center;
gap:11px;
border:1px solid #d9e2ea;
border-radius:16px;
background:#fff;
box-shadow:0 2px 9px rgba(16,43,78,.05)
}
.search span{font-size:21px}
.search input{
width:100%;
border:0;
outline:0;
background:transparent;
font-size:16px;
color:#102b4e
}
.section{margin-top:24px}
.sectionTitle{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:11px
}
.sectionTitle strong{font-size:20px}
.offers{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}
.offer{
height:145px;
border-radius:14px;
overflow:hidden;
display:flex;
align-items:flex-end;
background:linear-gradient(145deg,#174361,#7899a8);
color:#fff
}
.offer:nth-child(2){background:linear-gradient(145deg,#31596c,#a7c3ce)}
.offer:nth-child(3){background:linear-gradient(145deg,#145276,#7c9d9c)}
.offer div{
width:100%;
padding:10px;
background:linear-gradient(transparent,rgba(0,0,0,.7))
}
.offer strong,.offer small{display:block}
.offer strong{font-size:13px}
.offer small{font-size:11px;margin-top:3px}
.page{display:none}
.page.active{display:block}
.back{
border:0;
background:none;
padding:3px 0 15px;
color:#1164a0;
font-weight:600
}
.panel h1{margin:5px 0 20px}
.largeBtn{
width:100%;
border:1px solid #dce4ec;
background:#fff;
border-radius:17px;
padding:19px;
margin-bottom:11px;
text-align:left;
color:#102b4e;
box-shadow:0 2px 9px rgba(16,43,78,.05)
}
.largeBtn strong{display:block;font-size:17px}
.largeBtn small{
display:block;
margin-top:5px;
color:#718095
}
.tariffSelector{
border:1px solid #dce4ec;
border-radius:17px;
overflow:hidden;
margin-bottom:13px;
box-shadow:0 2px 9px rgba(16,43,78,.05)
}
.tariffMain{
width:100%;
border:0;
background:#fff;
padding:19px;
text-align:left;
color:#102b4e
}
.tariffMain strong{
display:block;
font-size:18px
}
.tariffMain small{
display:block;
margin-top:5px;
color:#718095
}
.frozenOptions{
display:none;
background:#f7f9fc;
border-top:1px solid #e1e7ed
}
.frozenOptions button{
width:100%;
padding:15px 19px;
border:0;
border-bottom:1px solid #e1e7ed;
background:transparent;
text-align:left;
color:#102b4e
}
.frozenOptions button:last-child{border-bottom:0}
.products{
margin-top:16px;
border:1px solid #dce4ec;
border-radius:16px;
overflow:hidden
}
.productRow{
padding:14px;
border-bottom:1px solid #e4e9ee;
display:grid;
grid-template-columns:1fr auto;
gap:10px
}
.productRow:last-child{border-bottom:0}
.productName{font-weight:600}
.productMeta{
font-size:12px;
color:#718095;
margin-top:4px
}
.price{
font-weight:700;
color:#0c629d;
white-space:nowrap
}
.empty{
padding:24px 15px;
text-align:center;
color:#718095
}
.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#e8f3fb;
color:#12629b;
font-size:12px;
font-weight:600;
margin-bottom:10px
}
.today{
margin-top:18px;
width:100%;
padding:16px;
border:1px solid #dce4ec;
border-radius:16px;
background:#fff;
display:flex;
align-items:center;
gap:12px;
text-align:left;
color:#102b4e
}
.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:76px;
background:rgba(255,255,255,.97);
border-top:1px solid #e0e6ec;
z-index:20
}
.bottomInner{
max-width:760px;
height:100%;
margin:auto;
display:grid;
grid-template-columns:repeat(5,1fr)
}
.nav{
border:0;
background:none;
color:#68798b;
font-size:11px
}
.nav b{
display:block;
font-size:22px;
margin-bottom:3px
}
.nav.active{
color:#1165a0;
font-weight:700
}
.menu{
position:fixed;
top:0;
right:-310px;
width:290px;
height:100%;
background:#fff;
z-index:50;
box-shadow:-8px 0 25px rgba(0,0,0,.15);
padding:25px 20px;
transition:.25s
}
.menu.open{right:0}
.menu h2{margin-top:40px}
.menu button{
width:100%;
border:0;
background:#f4f7fa;
padding:15px;
border-radius:12px;
text-align:left;
margin:5px 0;
color:#102b4e
}
.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.3);
z-index:40
}
.overlay.open{display:block}
@media(max-width:420px){
.banner{height:180px}
.bannerText strong{font-size:27px}
.card{padding:14px}
.offer{height:132px}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="brands">
<div class="brand">GARCIMAR</div>
<div class="divider"></div>
<div class="brand">GranBlau</div>
</div>
<div class="nil">NIL&KAI</div>
<button class="topMenu" onclick="openMenu()">☰</button>
</header>

<main>

<!-- INICIO -->
<section id="inicio" class="page active">

<div class="banner">
<div class="bannerText">
<strong>DEL MAR<br>A LA TEVA TAULA</strong>
<span>CALIDAD · CONFIANZA · SERVICIO</span>
</div>
</div>

<div class="content">

<div class="grid">

<button class="card primary" onclick="showPage('tarifas')">
<div class="icon">📄</div>
<strong>Tarifas</strong>
<small>Fresco y congelado</small>
</button>

<button class="card" onclick="showPage('generar')">
<div class="icon">＋</div>
<strong>Generar</strong>
<small>Crear tarifa personalizada</small>
</button>

<button class="card" onclick="showPage('clientes')">
<div class="icon">👥</div>
<strong>Clientes</strong>
<small>Gestiona tus clientes</small>
</button>

<button class="card" onclick="alert('Esta función será exclusiva para la cuenta autorizada.')">
<div class="icon">⬆️</div>
<strong>Subir tarifas</strong>
<small>Actualizar Excel</small>
</button>

</div>

<div class="search">
<span>🔍</span>
<input placeholder="Buscar en toda la app…" oninput="globalSearch(this.value)">
</div>

<div class="section">
<div class="sectionTitle">
<strong>⭐ Oferta diaria</strong>
</div>

<div class="offers">
<div class="offer">
<div><strong>ATÚN SEMANAL</strong><small>Oferta semanal</small></div>
</div>
<div class="offer">
<div><strong>FRESCO 1</strong><small>Producto destacado</small></div>
</div>
<div class="offer">
<div><strong>FRESCO 2</strong><small>Producto del día</small></div>
</div>
</div>
</div>

<button class="today" onclick="alert('Aquí aparecerán los clientes con servicio hoy.')">
<div style="font-size:27px">🚚</div>
<div>
<strong>CLIENTES CON SERVICIO HOY</strong>
<div style="font-size:12px;color:#718095;margin-top:4px">
Consultar ruta de hoy
</div>
</div>
</button>

</div>
</section>


<!-- TARIFAS -->
<section id="tarifas" class="page">

<div class="panel">

<button class="back" onclick="showPage('inicio')">← Inicio</button>

<h1>Tarifas</h1>

<div class="tariffSelector">

<button class="tariffMain" onclick="selectTariff('fresco')">
<strong>🐟 Tarifa Fresco</strong>
<small>Seleccionar tarifa de pescado fresco</small>
</button>

</div>

<div class="tariffSelector">

<button class="tariffMain" onclick="toggleFrozen()">
<strong>❄️ Tarifa Congelado ▾</strong>
<small>Selecciona una de las cuatro tarifas</small>
</button>

<div class="frozenOptions" id="frozenOptions">

<button onclick="selectTariff('congelado1')">
<strong>Congelado 1</strong>
</button>

<button onclick="selectTariff('congelado2')">
<strong>Congelado 2</strong>
</button>

<button onclick="selectTariff('congelado3')">
<strong>Congelado 3</strong>
</button>

<button onclick="selectTariff('congelado4')">
<strong>Congelado 4</strong>
</button>

</div>
</div>

<div id="selectedTariff"></div>

<div class="search">
<span>🔍</span>
<input id="productSearch"
placeholder="Buscar producto, código…"
oninput="filterProducts(this.value)">
</div>

<div id="products" class="products">
<div class="empty">
Selecciona primero una tarifa.
</div>
</div>

</div>
</section>


<!-- GENERAR -->
<section id="generar" class="page">
<div class="panel">

<button class="largeBtn" onclick="showPage('clientes')">

<h1>Generar tarifa</h1>

<button class="largeBtn" onclick="showPage('clientes')">
<strong>👤 Cliente existente</strong>
<small>Buscar por nombre o código de cliente</small>
</button>

<button class="largeBtn">
<strong>📄 Tarifa sin cliente</strong>
<small>Crear una tarifa independiente</small>
</button>

</div>
</section>


<!-- CLIENTES -->
<section id="clientes" class="page">
<div class="panel">

<button class="back" onclick="showPage('inicio')">← Inicio</button>

<h1>Clientes</h1>

<button class="largeBtn" onclick="newClientForm()">
<strong>＋ Nuevo cliente</strong>
<small>Crear ficha de cliente</small>
</button>

<div class="search">
<span>🔍</span>
<input placeholder="Buscar por nombre o código…">
</div>

<div class="empty">
Todavía no hay clientes cargados.
</div>

</div>
</section>


<!-- CYC -->
<section id="cyc" class="page">
<div class="panel">

<button class="back" onclick="showPage('inicio')">← Inicio</button>

<h1>CYC</h1>

<button class="largeBtn">
<strong>👤 Cliente existente</strong>
<small>Preparar solicitud CYC</small>
</button>

<button class="largeBtn">
<strong>＋ Nuevo cliente</strong>
<small>Crear cliente y solicitud CYC</small>
</button>

<button class="largeBtn">
<strong>📋 CYC enviados</strong>
<small>Consultar solicitudes enviadas</small>
</button>

</div>
</section>

</main>
</div>


<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<aside class="menu" id="menu">

<button onclick="closeMenu()">✕ Cerrar</button>

<h2>Más</h2>

<button>👤 Mi perfil</button>
<button>⚙️ Ajustes</button>
<button>📸 Ofertas</button>
<button>🗑️ Papelera</button>
<button>📱 Instalar aplicación</button>
<button>🚪 Cerrar sesión</button>

</aside>


<nav class="bottom">

<div class="bottomInner">

<button class="nav active" onclick="showPage('inicio')">
<b>⌂</b>Inicio
</button>

<button class="nav" onclick="showPage('tarifas')">
<b>▤</b>Tarifas
</button>

<button class="nav" onclick="showPage('generar')">
<b>＋</b>Generar
</button>

<button class="nav" onclick="showPage('clientes')">
<b>♙</b>Clientes
</button>

<button class="nav" onclick="showPage('cyc')">
<b>▣</b>CYC
</button>

</div>

</nav>


<script>

const productos = {

fresco:[
{producto:"Salmón fresco",codigo:"F001",unidad:"kg",precio:14.50},
{producto:"Lubina",codigo:"F002",unidad:"kg",precio:18.50},
{producto:"Dorada",codigo:"F003",unidad:"kg",precio:16.90},
{producto:"Atún rojo",codigo:"F004",unidad:"kg",precio:25.00},
{producto:"Gamba roja",codigo:"F005",unidad:"kg",precio:32.00}
],

congelado1:[
{producto:"Calamar congelado",codigo:"C101",unidad:"kg",precio:12.50},
{producto:"Gamba congelada",codigo:"C102",unidad:"kg",precio:15.90}
],

congelado2:[
{producto:"Merluza congelada",codigo:"C201",unidad:"kg",precio:10.90},
{producto:"Bacalao congelado",codigo:"C202",unidad:"kg",precio:14.90}
],

congelado3:[
{producto:"Pulpo congelado",codigo:"C301",unidad:"kg",precio:18.90},
{producto:"Sepia congelada",codigo:"C302",unidad:"kg",precio:16.50}
],

congelado4:[
{producto:"Langostino congelado",codigo:"C401",unidad:"kg",precio:13.90},
{producto:"Vieira congelada",codigo:"C402",unidad:"kg",precio:22.00}
]

};

let tarifaActual="";
function newClientForm(){
  const s=document.getElementById("clientes");
  s.innerHTML=`
    <div class="panel">
    <button class="back" onclick="showPage('clientes')">← Volver</button>
      <h1>Nuevo cliente</h1>

      <label>Nombre comercial *</label>
      <input id="ncComercial" placeholder="Nombre comercial">

      <label>Nombre fiscal *</label>
      <input id="ncFiscal" placeholder="Nombre fiscal">

      <label>CIF / NIF *</label>
      <input id="ncNif" placeholder="CIF / NIF">

      <label>Código de cliente</label>
      <input id="ncCodigo" placeholder="Opcional">

      <label>Persona de contacto</label>
      <input id="ncContacto" placeholder="Persona de contacto">

      <label>Teléfono</label>
      <input id="ncTelefono" type="tel" placeholder="Teléfono">

      <label>Email</label>
      <input id="ncEmail" type="email" placeholder="Email">

      <h3>Dirección fiscal</h3>

      <label>Dirección fiscal *</label>
      <input id="ncFiscalDireccion" placeholder="Dirección fiscal">

      <label>Localidad *</label>
      <input id="ncLocalidad" placeholder="Localidad">

      <label>Provincia *</label>
      <input id="ncProvincia" placeholder="Provincia">

      <label>Código postal *</label>
      <input id="ncCP" inputmode="numeric" placeholder="Código postal">

      <h3>Dirección del local</h3>

      <label>
        <input id="ncMismaDireccion" type="checkbox"
          onchange="document.getElementById('ncLocalDireccion').value=this.checked?document.getElementById('ncFiscalDireccion').value:''">
        La dirección fiscal es la misma que la del local
      </label>

      <label>Dirección local</label>
      <input id="ncLocalDireccion" placeholder="Dirección del local">

      <h3>Días de servicio</h3>

      <label><input type="checkbox" value="Lun" class="ncDia"> Lunes</label>
      <label><input type="checkbox" value="Mar" class="ncDia"> Martes</label>
      <label><input type="checkbox" value="Mié" class="ncDia"> Miércoles</label>
      <label><input type="checkbox" value="Jue" class="ncDia"> Jueves</label>
      <label><input type="checkbox" value="Vie" class="ncDia"> Viernes</label>
      <label><input type="checkbox" value="Sáb" class="ncDia"> Sábado</label>

      <label>Notas</label>
      <textarea id="ncNotas" placeholder="Notas"></textarea>

      <button class="largeBtn" onclick="saveNewClient()">
        <strong>Guardar cliente</strong>
      </button>
    </div>
  `;
}

function saveNewClient(){
  const comercial=document.getElementById("ncComercial").value.trim();
  const fiscal=document.getElementById("ncFiscal").value.trim();
  const nif=document.getElementById("ncNif").value.trim();
  const fiscalDireccion=document.getElementById("ncFiscalDireccion").value.trim();
  const localidad=document.getElementById("ncLocalidad").value.trim();
  const provincia=document.getElementById("ncProvincia").value.trim();
  const cp=document.getElementById("ncCP").value.trim();

  if(!comercial||!fiscal||!nif||!fiscalDireccion||!localidad||!provincia||!cp){
    alert("Completa todos los campos obligatorios.");
    return;
  }

  const cliente={
    id:Date.now(),
    nombreComercial:comercial,
    nombreFiscal:fiscal,
    nif:nif,
    codigo:document.getElementById("ncCodigo").value.trim(),
    contacto:document.getElementById("ncContacto").value.trim(),
    telefono:document.getElementById("ncTelefono").value.trim(),
    email:document.getElementById("ncEmail").value.trim(),
    direccionFiscal:fiscalDireccion,
    direccionLocal:document.getElementById("ncLocalDireccion").value.trim(),
    localidad:localidad,
    provincia:provincia,
    cp:cp,
    dias:[...document.querySelectorAll(".ncDia:checked")].map(x=>x.value),
    notas:document.getElementById("ncNotas").value.trim(),
    creado:new Date().toISOString()
  };

  let clientes=JSON.parse(localStorage.getItem("nilkai_clientes")||"[]");
  clientes.unshift(cliente);
  localStorage.setItem("nilkai_clientes",JSON.stringify(clientes));

  alert("Cliente guardado correctamente.");
  showPage("clientes");
}
function showPage(id){

document.querySelectorAll(".page").forEach(
p=>p.classList.remove("active")
);

document.getElementById(id).classList.add("active");

const orden=["inicio","tarifas","generar","clientes","cyc"];

document.querySelectorAll(".nav").forEach(
n=>n.classList.remove("active")
);

const index=orden.indexOf(id);

if(index>=0){
document.querySelectorAll(".nav")[index].classList.add("active");
}

window.scrollTo(0,0);
}

function toggleFrozen(){

const menu=document.getElementById("frozenOptions");

menu.style.display=
menu.style.display==="block"?"none":"block";
}

function selectTariff(tipo){

tarifaActual=tipo;

const nombres={
fresco:"Tarifa Fresco",
congelado1:"Congelado 1",
congelado2:"Congelado 2",
congelado3:"Congelado 3",
congelado4:"Congelado 4"
};

document.getElementById("selectedTariff").innerHTML=
'<div class="badge">'+nombres[tipo]+"</div>";

document.getElementById("productSearch").value="";

renderProducts(productos[tipo]);

document.getElementById("frozenOptions").style.display="none";
}

function renderProducts(lista){

const container=document.getElementById("products");

if(!lista.length){

container.innerHTML=
'<div class="empty">No se han encontrado productos.</div>';

return;
}

container.innerHTML=lista.map(p=>`

<div class="productRow">

<div>
<div class="productName">${p.producto}</div>
<div class="productMeta">
Código: ${p.codigo} · Unidad: ${p.unidad}
</div>
</div>

<div class="price">
${p.precio.toFixed(2)} €/kg
</div>

</div>

`).join("");
}

function filterProducts(text){

if(!tarifaActual)return;

const q=text.toLowerCase().trim();

const lista=productos[tarifaActual].filter(p=>
p.producto.toLowerCase().includes(q) ||
p.codigo.toLowerCase().includes(q)
);

renderProducts(lista);
}

function globalSearch(text){

if(text.trim().length>1){
console.log("Búsqueda global:",text);
}
}

function openMenu(){

document.getElementById("menu").classList.add("open");
document.getElementById("overlay").classList.add("open");
}

function closeMenu(){

document.getElementById("menu").classList.remove("open");
document.getElementById("overlay").classList.remove("open");
}

</script>

</body>
</html>
